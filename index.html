<!DOCTYPE html>
<html lang="en" data-mode="encrypt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CIPHER</title>
  <meta name="description" content="Secure client-side message encryption using AES-256-GCM." />

  <!-- PWA & Mobile Themeing -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="heart-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="heart-192.png" type="image/png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dither field: living full-viewport background (dither-bg.js) -->
  <canvas id="ditherField"></canvas>

  <main>
    <header class="blk">
      <div class="logo-icon">
        <!-- Pixel Art Lock Icon -->
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
          <rect x="3" y="7" width="10" height="8" fill="white"/>
          <rect x="5" y="3" width="6" height="5" fill="none" stroke="white" stroke-width="2"/>
          <rect x="7" y="10" width="2" height="3" fill="black"/>
        </svg>
      </div>
      <h1>Cipher</h1>
      <span id="appVersion" class="version">v3</span>
    </header>

    <section class="settings blk">
      <span class="thread t1" aria-hidden="true"><i></i></span>
      <div class="settings-header">
        <div class="field-head">
          <span class="step">01</span>
          <label for="pass" class="settings-title">Passphrase</label>
        </div>
        <p class="settings-subtitle">The secret you and B will both type. Never text it with the message.</p>
      </div>
      <div class="settings-content">
        <div class="form-group">
          <input id="pass" type="password" placeholder="enter shared secret key" autocomplete="new-password">
          <button id="togglePassBtn" type="button" class="pass-toggle" aria-label="Toggle password visibility" aria-pressed="false">
            <!-- Pixel eye: open = solid ink bands; hidden = dashed dithered lid -->
            <svg class="eye-open" viewBox="0 0 16 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="5" width="8" height="2"/>
              <rect x="2" y="7" width="2" height="2"/>
              <rect x="12" y="7" width="2" height="2"/>
              <rect x="4" y="9" width="8" height="2"/>
              <rect x="6" y="7" width="4" height="2"/>
            </svg>
            <svg class="eye-closed" viewBox="0 0 16 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="7" width="2" height="2"/>
              <rect x="7" y="7" width="2" height="2"/>
              <rect x="11" y="7" width="2" height="2"/>
            </svg>
          </button>
          <div id="strength" role="meter" aria-label="Password strength" aria-valuetext=""></div>
        </div>
        <div class="passphrase-actions">
          <button id="generatePassBtn" class="btn btn-subtle" type="button" aria-label="Generate a random passphrase">Generate</button>
          <button id="clearAllBtn" class="btn btn-subtle" type="button">Clear All</button>
        </div>
      </div>
    </section>

    <section class="compose blk">
      <nav class="tabs-nav" role="tablist" aria-label="Message actions">
        <span class="tab-indicator" aria-hidden="true"></span>
        <button id="nav-encrypt" class="tab-btn active" role="tab" type="button" aria-selected="true" aria-controls="tab-encrypt">Encrypt</button>
        <button id="nav-decrypt" class="tab-btn decrypt" role="tab" type="button" aria-selected="false" aria-controls="tab-decrypt">Decrypt</button>
      </nav>

      <div class="stage">
        <div id="tab-encrypt" class="tab-content active" role="tabpanel" aria-labelledby="nav-encrypt">
          <div class="message-card">
            <div class="field-head">
              <span class="step">02</span>
              <label for="pt">Input Message</label>
            </div>
            <textarea id="pt" placeholder="Type your secret message here..." aria-describedby="status"></textarea>
            <div class="foot-row">
              <span class="step step-act">03 Seal</span>
              <span class="char-count" aria-live="polite"></span>
            </div>
            <button id="encryptBtn" class="action-btn encrypt" type="button">Encrypt</button>
            <span class="hint">Press Enter to encrypt</span>
          </div>
        </div>

        <div id="tab-decrypt" class="tab-content" role="tabpanel" aria-labelledby="nav-decrypt">
          <div class="message-card">
            <div class="field-head">
              <span class="step">02</span>
              <label for="ct">Encrypted Data</label>
            </div>
            <textarea id="ct" placeholder="Paste encrypted message here..." aria-describedby="status"></textarea>
            <div class="foot-row">
              <span class="step step-act">03 Open</span>
              <span class="char-count" aria-live="polite"></span>
            </div>
            <button id="decryptBtn" class="action-btn decrypt" type="button">Decrypt</button>
            <span class="hint">Press Enter to decrypt</span>
          </div>
        </div>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <footer class="footer blk">
      <div class="footer-line"></div>
      <p class="dedication">Dedicated to B.</p>
      <p class="tech-info">AES-256-GCM // PBKDF2-SHA256</p>
      <button id="selfTestBtn" class="footer-link" type="button">Run self-test</button>
    </footer>
  </main>

  <div id="resultOverlay" class="result-overlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="result-card">
      <h2 id="resultTitle"></h2>
      <textarea id="resultContent" readonly aria-label="Result content"></textarea>
      <div id="resultQrWrap" class="result-qr-wrap" hidden>
        <canvas id="resultQrCanvas" aria-label="QR code for the share link"></canvas>
        <p class="result-qr-caption">In person: have B scan this with their phone</p>
      </div>
      <p id="resultHint" class="result-hint" hidden></p>
      <div class="result-footer">
        <div class="result-actions">
          <button id="resultCopyBtn" class="btn primary" type="button">Copy</button>
          <button id="resultLinkBtn" class="btn" type="button" hidden>Link</button>
          <button id="resultShareBtn" class="btn share-btn" type="button">Share</button>
          <button id="resultQrBtn" class="btn qr-btn" type="button" hidden>QR (in person)</button>
        </div>
        <button id="resultReplyBtn" class="btn btn-close" type="button" hidden>Reply</button>
        <button id="resultDoneBtn" class="btn btn-close" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="version.js"></script>
  <script src="dither-bg.js"></script>
  <script src="crypto.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="vendor/wordlist.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
